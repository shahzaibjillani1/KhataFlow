<div *transloco="let t" [dir]="dir()" class="min-h-screen flex items-center justify-center bg-bg-page px-4">

  <div class="w-full max-w-md bg-bg-card rounded-3xl shadow-xl p-6 sm:p-8">

    <div class="flex items-center gap-3 mb-6 sm:mb-8">
      <img src="images/flow.png" alt="logo" class="w-10 sm:w-12 h-8 sm:h-10 rounded-xl sm:rounded-2xl" />
      <h1 class="text-xl sm:text-2xl font-semibold text-text-heading">
        {{ t('sidebar.brandPart1') }}<span class="text-primary-text">{{ t('sidebar.brandPart2') }}</span>
      </h1>
    </div>

    <h2 class="text-xl sm:text-2xl font-bold text-text-heading">
      {{ t('register.createAccount') }}
    </h2>
    <p class="text-text-muted text-sm mb-6">
      {{ t('register.subtitle') }}
    </p>

    @if (errorMessageKey()) {
    <div class="mb-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm">
      {{ t(errorMessageKey()!) }}
    </div>
    }

    <form class="space-y-4" (ngSubmit)="register()">

      <div>
        <label class="text-xs font-semibold text-text-label">{{ t('register.businessName') }}</label>
        <input type="text" [(ngModel)]="businessName" name="businessName"
          [placeholder]="t('register.businessNamePlaceholder')"
          class="w-full mt-1 p-3 rounded-xl bg-input-bg border border-input-border focus:ring-2 focus:ring-focus-ring focus:outline-none text-text-body" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

        <div>
          <label class="text-xs font-semibold text-text-label">{{ t('register.ownerName') }}</label>
          <input type="text" [(ngModel)]="fullName" name="fullName" [placeholder]="t('register.ownerNamePlaceholder')"
            class="w-full mt-1 p-3 rounded-xl bg-input-bg border border-input-border focus:ring-2 focus:ring-focus-ring focus:outline-none text-text-body" />
        </div>

        <div>
          <label class="text-xs font-semibold text-text-label">{{ t('register.phone') }}</label>
          <input type="text" [(ngModel)]="phoneNumber" name="phoneNumber" [placeholder]="t('register.phonePlaceholder')"
            class="w-full mt-1 p-3 rounded-xl bg-input-bg border border-input-border focus:ring-2 focus:ring-focus-ring focus:outline-none text-text-body" />
        </div>

      </div>

      <div>
        <label class="text-xs font-semibold text-text-label">{{ t('register.email') }}</label>
        <input type="email" [(ngModel)]="email" name="email" [placeholder]="t('register.emailPlaceholder')"
          class="w-full mt-1 p-3 rounded-xl bg-input-bg border border-input-border focus:ring-2 focus:ring-focus-ring focus:outline-none text-text-body" />
      </div>

      <div>
        <label class="text-xs font-semibold text-text-label">{{ t('register.password') }}</label>
        <div class="relative mt-1">
          <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password"
            placeholder="••••••••"
            class="w-full p-3 pr-10 rounded-xl bg-input-bg border border-input-border focus:ring-2 focus:ring-focus-ring focus:outline-none text-text-body" />
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-3 flex items-center text-text-muted hover:text-text-body"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" x2="22" y1="2" y2="22" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full bg-btn-primary hover:bg-btn-primary-hover text-white py-3 rounded-xl font-medium shadow-md transition disabled:opacity-60">
        {{ isLoading() ? t('register.creatingAccount') : t('register.createAccountBtn') }}
      </button>

      <p class="text-center text-sm text-text-muted">
        {{ t('register.alreadyHaveAccount') }}
        <a routerLink="/login" class="text-primary-text font-medium">{{ t('register.signIn') }}</a>
      </p>

    </form>

  </div>

</div>

<router-outlet></router-outlet>
